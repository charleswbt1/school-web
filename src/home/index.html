<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="icon" type="image/x-icon" href="../components/favicon.ico" />
    <link rel="stylesheet" href="../components/styles.css">
    <link rel="stylesheet" href="../home/index.css">
</head>

<body>

    <div id="sidebar-container"></div>

    <div class="main-container">

        <div id="header-container"></div>

        <!-- CARRUSEL DE EVENTOS -->
        <section class="events-section">
            <div class="events-carousel">
                <button class="event-carousel-btn event-prev" id="eventPrev">
                    ‹
                </button>
                <div class="events-slider" id="eventsSlider">
                    <div class="event-slide active">
                        <a href="https://storage.googleapis.com/school-source/web/event/event1.jpeg" target="_blank">
                            <img src="https://storage.googleapis.com/school-source/web/event/event1.jpeg" alt="Evento">
                        </a>
                    </div>
                </div>
                <button class="event-carousel-btn event-next" id="eventNext">
                    ›
                </button>
            </div>
            <div class="event-indicators" id="eventIndicators"></div>
        </section>

        <section class="courses-section">
            <h2>Cursos Disponibles</h2>
            <div class="courses-container" id="coursesContainer"></div>
        </section>

    </div>

    <!-- MODAL CONTENT -->
    <div id="contentModal" class="modal">

        <div class="modal-content" id="contentData">

        </div>

    </div>
    <!-- MODAL LOGIN -->
    <div id="modal-container"></div>
    <script src="../components/app.js"></script>
    <script src="../home/index.js"></script>

</body>

</html>
